# T-trig: triggering fixture. A natural build-this-test-first request that never names the
# skill; the one item asks whether the Skill call for tdd came before any other work.
# The param is the plugin-qualified name: real transcripts carry `workbench:<name>` in the Skill
# call and the matcher compares exactly.
# The fixture is a small committed uv/pytest tree (pytest pinned, no lockfile), copied into a
# fresh <dest>, so no case-agent ever runs inside the-workshop checkout.
# A triggering item selects the skill-arm-only admission branch (6 executions, at least 5
# hits, no no-skill arm); this file carries no calibration key of its own.
mode = "subagent"
prompt = "prompt.md"

[[items]]
id = "T-trig"
kind = "triggering"
scorer = "triggered_first"
params = { skill = "workbench:tdd" }
