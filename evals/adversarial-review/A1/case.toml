# A1: self-review of the settlement fixture's claimed rounding fix (single agent).
# The fixture is built by the plugin's own script, run as `python <builder> <dest>`
# into a not-yet-existing <dest>; the harness fingerprints that built output
# (`evals._harness.fingerprint.builder_output_fingerprint`), this case does not.
#
# invoke_skill = true makes the skill arm's prompt start with one fixed line telling the agent to
# use the workbench:adversarial-review skill, a blank line, then prompt.md verbatim
# (INVOKE_SKILL_PREAMBLE in evals/_harness/dispatch.py). The no-skill arm never carries the line,
# and prompt.md itself stays free of the skill's name. So A1-coverage-bound measures whether the
# skill's report slot (`## Could not verify`) appears and names a surface once the skill is in
# play, not whether the skill fires: A3 measures firing. At the first calibration the skill never
# fired in A1's skill arm, so that arm behaved like the no-skill arm. The key is refused on a case
# with a triggering item (A1 has none), and compute_input_hash covers it.
mode = "subagent"
prompt = "prompt.md"
invoke_skill = true
builder = "plugins/workbench/skills/adversarial-review/scripts/build_fixture.py"

# The coverage bound: a `## Could not verify` section naming a surface from the
# fixture-listed surface set (surfaces.toml). Scorer: location (the section) AND regex.
[[items]]
id = "A1-coverage-bound"
kind = "gate-candidate"
scorer = "coverage_bound"

# The three planted defects. Trend items only: never gated here.
[[items]]
id = "A1-defect-decimal-from-float"
kind = "trend"
scorer = "defect_decimal_from_float"
params = { file_suffix = "/rounding.py", regex = 'Decimal\s*\(\s*(?:amount|1\.005|a\s+float)|(?:from|with|of)\s+(?:a\s+)?(?:python\s+)?float|1\.0049+|binary\s+float|float(?:ing)?[ -]point|no-?op|identical\s+to\s+(?:the\s+)?(?:old|original|main)' }

[[items]]
id = "A1-defect-tests-no-teeth"
kind = "trend"
scorer = "defect_tests_no_teeth"
params = { file_suffix = "/test_rounding.py", regex = '(?:all\s+(?:six|6)|still\s+(?:pass|green)|(?:revert|restor|original|main).{0,80}(?:pass|green)|no\s+teeth|vacuous|contradict|asserts?\s*(?:==|equals?)?\s*1\.00|would\s+not\s+(?:catch|fail)|(?:does|do)(?:n.t|\s+not)\s+(?:catch|fail|go\s+red))' }

[[items]]
id = "A1-defect-missed-call-site"
kind = "trend"
scorer = "defect_missed_call_site"
params = { file_suffix = "/invoice.py", regex = 'line_total.{0,120}\bround\s*\(|\bround\s*\(.{0,120}line_total|bare\s+`?round|(?:not|never|doesn.t|does\s+not|bypass\w*)\s+(?:rout\w+\s+)?(?:through\s+)?`?round_amount|missed\s+call\s+site|still\s+(?:calls?|uses?)\s+`?(?:the\s+)?(?:built-?in\s+|bare\s+)?round' }
