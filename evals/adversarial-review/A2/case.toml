]+|[ \t]*\n[ \t]*)(?:anywhere|in|of|at|all|the|a|an|any|this|whole|entire|function|file|script|module|code|index|squash\(\)|here|diff|history)(?![\w-])){0,3}(?:(?:[ \t]+|[ \t]*\n[ \t]*)(?:is|was|are|were)(?:[ \t]+|[ \t]*\n[ \t]*)(?:\w+ly(?:[ \t]+|[ \t]*\n[ \t]*))?(?:missing|absent|omitted|not(?:[ \t]+|[ \t]*\n[ \t]*)(?:implemented|present|written|there|enforced|added|done)|never(?:[ \t]+|[ \t]*\n[ \t]*)(?:implemented|written|added|existed))(?![\w-])|(?:[ \t]+|[ \t]*\n[ \t]*)(?:does\s+not|doesn.t|did\s+not)(?:[ \t]+|[ \t]*\n[ \t]*)exist(?![\w-]))|(?<![\w-])(?<!if there were )(?<!if there was )(?<!if there is )(?<!if there are )(?<!if )(?<!unless )(?<!unlike )(?:no(?!\s+(?:longer|(?:issue|problem|defect|regression|bug|concern|need|worry|risk|difference|impact)s?\b))|never(?!\s+fails?\s+to)|not(?!\s+only)|nowhere|without(?!\s+the\b)|missing|lacks?|lacking|absent|omits?|omitted|doesn.t|(?<!never )fails?\s+to|forgets?\s+to)(?![\w-])(?:(?:[ \t]+|[ \t]*\n[ \t]*)(?:the|any|an|a|such|ever|actually|even|really|explicit|explicitly|dedicated|separate|real|proper|yet|currently|also|is|there|has|have|exists?|one)(?![\w-])){0,3}(?:[ \t]+|[ \t]*\n[ \t]*)(?:run|call|invok|use|execut)\w*(?:[ \t]+|[ \t]*\n[ \t]*)(?:the(?:[ \t]+|[ \t]*\n[ \t]*))?`?git(?:[ \t]+|[ \t]*\n[ \t]*)diff(?:[ \t]+|[ \t]*\n[ \t]*)--cached'
