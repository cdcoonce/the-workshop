# A2: lens-mode review of the doctored PR #896 diff (the terse-lens-contract A/B's fixture).
# Run inline: the conductor plays adversarial-review's own conductor role and dispatches
# the lens agents itself, giving each the prompt text build_dispatch_prompt returns, with
# the lens narrowing taken from the skill's own references/pr-lens-review.md. The case
# supplies the story (prompt.md) and the fixture; it supplies no lens text.
#
# The fixture is a static, committed copy (fixture/, see provenance.toml): the harness
# fingerprints it as the deps.tree_hash of that directory, this case computes nothing.
#
# ab_raws/ holds the experiment's saved lens replies. They are matcher-development and
# cross-match-audit material only: never calibration input. Nothing scored reads them;
# calibration for gating happens only through the hand-run issue #989 executing this case.
mode = "inline"
prompt = "prompt.md"
envelope = "findings"

# Every matcher is #992's conjunctive review_match: location AND regex, no disjunctive
# fallback (the experiment's score_arm.py:65 `in_window or bool(regex.search(desc))` is
# retired). A window item needs the file suffix AND a line in the window AND the regex; a
# file-level item needs the file suffix AND the regex.

[[items]]
id = "A2-D1"
kind = "gate-candidate"
scorer = "pushed_prefix_off_by_one"
[items.params]
file_suffix = "scripts/sync_boundary_squash.py"
line_window = [105, 125]
regex = 'classify_pushed_prefix|first_unpushed|prefix.{0,40}(off.by.one|\+\s*1|one too|incorrect|wrong|misclassif)'

[[items]]
id = "A2-D2"
kind = "gate-candidate"
scorer = "ancestor_argument_swap"
[items.params]
file_suffix = "scripts/sync_boundary_squash.py"
line_window = [197, 217]
regex = '_is_ancestor.{0,80}(swap|revers|invert|order|backward|wrong (way|direction))|ancestor.{0,60}(remote_head).{0,40}(sha|session)|pushed_flags.{0,60}(invert|revers|wrong|backward)'

# D3 is a trend item: reported, never gated.
[[items]]
id = "A2-D3"
kind = "trend"
scorer = "weakened_collapse_assertion"
[items.params]
file_suffix = "tests/test_sync_boundary_squash.py"
line_window = [139, 160]
regex = '>=\s*1|at least (one|1)|weak|tautolog|vacuous|trivial|always (true|pass)|never fail|does not assert (exactly|the collapse)|passes (without|even)'

# D4 and D5 are file-level: no line window, the file suffix is the whole location.
[[items]]
id = "A2-D4"
kind = "gate-candidate"
scorer = "anti_scope_edit"
[items.params]
file_suffix = "vault-sync/references/command.md"
regex = 'vault-sync'

# D5 is an absence. The experiment's regex was the bare alternation
# `staged|--cached|uncommitted`, so any passing mention of those words credited it. The
# tightened regex credits only five shapes of "the guard is missing", each with a negator
# or absence word, the guard's vocabulary (check, guard, inspect, ...) and one of
# staged / uncommitted / --cached (or "the index" after an inspect-verb):
#   1. negator, up to two plain words, guard word, up to five words, marker   (no check for staged)
#   2. negator, up to four words, marker, up to two words, guard word        (no staged-changes guard)
#   3. negator, up to two plain words, inspect-verb, "the index"             (never inspects the index)
#   4. marker, guard word, "is missing|absent|not implemented"               (the staged-changes guard is missing)
#   5. guard word, marker, "is missing|absent|not implemented"
# Between a negator and the guard word no comma, colon, full stop or conjunction may sit,
# so "No issue here: it checks staged changes" and "does not handle X but staged changes are
# guarded" credit nothing. `not only`, `never fails to` and `no longer` are not negators.
# Word boundaries sit where a word could otherwise be entered mid-way (`piano`, `staged_files`,
# `unstaged-files guard is missing`); everywhere else a required space already stops it, so
# `unstaged`, `un-staged`, `nobody` and `no-op` count for nothing.
[[items]]
id = "A2-D5"
kind = "gate-candidate"
scorer = "missing_staged_guard"
[items.params]
file_suffix = "scripts/sync_boundary_squash.py"
regex = '(?<![\w-])(?:no(?!\s+longer)|never(?!\s+fails?\s+to)|not(?!\s+only)|nowhere|without|missing|lacks?|lacking|absent|omits?|omitted|doesn.t|does\s+not|did\s+not|(?<!never )fails?\s+to)(?:[ \t]+(?!(?:but|and|or|yet|while|though|although|however|so|because)\b)[\w/`-]+){0,2}?[ \t]+(?:check|guard|inspect|detect|handl|verif|skip|refus|look|examin|consult)\w*(?:,?[ \t]+(?!(?:but|and|or|yet|while|though|although|however|so|because)\b)[^\s.;:,]+){0,5}?,?[ \t]+(?:staged|uncommitted|--cached)(?!\w)|(?<![\w-])(?:no(?!\s+longer)|never(?!\s+fails?\s+to)|not(?!\s+only)|nowhere|without|missing|lacks?|lacking|absent|omits?|omitted|doesn.t|does\s+not|did\s+not|(?<!never )fails?\s+to)(?:[ \t]+(?!(?:but|and|or|yet|while|though|although|however|so|because)\b)[^\s.;:,]+){0,4}?[ \t]+(?:staged|uncommitted|--cached)(?!\w)[\w/`-]*(?:[ \t]+(?!(?:but|and|or|yet|while|though|although|however|so|because)\b)[\w/`-]+){0,2}?[ \t]+(?:check|guard|inspect|detect|handl|verif|skip|refus|look|examin|consult)\w*|(?<![\w-])(?:no(?!\s+longer)|never(?!\s+fails?\s+to)|not(?!\s+only)|nowhere|without|missing|lacks?|lacking|absent|omits?|omitted|doesn.t|does\s+not|did\s+not|(?<!never )fails?\s+to)(?:[ \t]+(?!(?:but|and|or|yet|while|though|although|however|so|because)\b)[\w/`-]+){0,2}?[ \t]+(?:inspect|look|examin|consult|read)\w*(?:[ \t]+at)?[ \t]+the[ \t]+index|(?<![\w-])(?:staged|uncommitted|--cached)(?!\w)[\w/`-]*(?:[ \t]+[\w/`-]+){0,2}?[ \t]+(?:check|guard|inspect|detect|handl|verif|skip|refus|look|examin|consult)\w*(?:[ \t]+[\w/`-]+){0,3}?[ \t]+(?:is|was|are)[ \t]+(?:\w+ly[ \t]+)?(?:missing|absent|not[ \t]+(?:implemented|present|written|there|enforced))|(?:check|guard|inspect|detect|handl|verif|skip|refus|look|examin|consult)\w*(?:[ \t]+[\w/`-]+){0,3}?[ \t]+(?:staged|uncommitted|--cached)(?!\w)(?:[ \t]+[\w/`-]+){0,2}?[ \t]+(?:is|was|are)[ \t]+(?:\w+ly[ \t]+)?(?:missing|absent|not[ \t]+(?:implemented|present|written|there|enforced))'
