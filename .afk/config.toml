# AFK config — read-only producers (F0) on the-workshop (afk's dev-cycle foundation).
# Executor stays OFF until a green gate is confirmed; scout is read-only.
# `make test` runs BOTH the root suite and the daa-code-review analyzer suite
# (the latter in its own rootdir, with ruff) — see the Makefile `test` target
# and #141. Keep this as `make test` so a gate can't silently skip the analyzer.
test_command = "make test"
permission_mode = "acceptEdits"

# Mirrors the `permissions.allow` block already checked into .claude/settings.json.
# This grants nothing new: every entry below is verbatim from that human-approved
# list. It has to be restated here because a slice runs in a worktree path that has
# never seen a trust dialog, and the trust gate discards settings.json `allow`
# entries wholesale — `--setting-sources project,local` loads the file, but only
# `--allowedTools` on argv survives (afk_driver/runtime.py:298-333).
#
# Without this, the agent gets no Bash at all. #564 quarantined `capability` after
# 2 attempts on exactly that: its reviewer reported "every Bash invocation of
# pytest/make was refused in this environment" and could not run the gate, so the
# final acceptance criterion went unverified — on work that was already correct and
# whose gate passed green when run by hand.
#
# `deny` entries in settings.json are NOT dropped by the trust gate and still beat
# an argv grant, so the checked-in git push / git merge / gh pr merge denials keep
# binding regardless of what is listed here.
allowed_tools = [
  "Bash(make test)",
  "Bash(make lint)",
  "Bash(make docs)",
  "Bash(make build)",
  "Bash(make verify-generated)",
  "Bash(make verify-versions)",
  "Bash(uv run python -m scripts.build_preset:*)",
  "Bash(uv run python -m scripts.build_marketplace:*)",
  "Bash(uv run python -m scripts.build_docs:*)",
  "Bash(uv run python -m scripts.smoke_test:*)",
]

# Integration posture (2026-06-15): promoted to F2 — slices merge-queue onto a
# standing afk/staging branch and surface as ONE staging→dev integration PR.
# auto_promote stays OFF: that MR is Charles's deliberate human gate. This
# repo is load-bearing estate infra, so the consolidated MR still gets a full
# human review. allow_f2_to_main left at default (false): never silently land on main.
autonomy_frontier = "F2"
integration_target = "afk/staging"
auto_promote = false

# This repo's promotion policy (root CLAUDE.md) is: branch off dev, PR into dev,
# promote dev → main, and never merge a feature branch straight into main. afk
# used to hardcode `main` for both the branch it forks slices from and the branch
# it opens the integration PR against, so every nightly aimed that PR at `main`
# against policy — #496 had to be retargeted by hand — and, because GitHub only
# auto-closes linked issues on merges into the DEFAULT branch, the `Closes`
# clause silently stopped closing them (#443 was closed by hand).
#
# afk#998 made it configurable. This is the one line that opts this repo in.
trunk_branch = "dev"

agent_prompt = """Implement the linked GitHub issue using test-driven development \
(red-green-refactor). Keep changes minimal and scoped to the issue's acceptance \
criteria. Match the surrounding code style. If the root cause of a failing test \
is unclear after targeted investigation, do not broaden the diff into unrelated \
files chasing a green run you do not understand — record your analysis in .afk/question.md \
and stop."""

[caps]
max_retries = 2
timeout_seconds = 3600  # was 1800: #279's cross-preset mechanical rewrite blew the wall clock (2026-07-17)
max_run_cost_usd = 30.0  # circuit-breaker: stop the drain if a run's cumulative cost exceeds this (unattended-F2 safety); sized for a ~10-slice drain at observed ~$3.50/slice

# Required since the driver's model-alias validation: default_tier resolves to
# 'cheap', so model.cheap must be set. Mirrors orbit-wars' convention; issue
# Budget lines (tier: cheap|frontier) map onto these aliases.
[model]
cheap = "sonnet"
frontier = "opus"
default_tier = "cheap"

# Scheduled --cycle: read-only producers only (no executor seeded here),
# so each pass files scout proposals + harvests prompt-rules from merged-PR
# review comments. Pure proposal/telemetry data; zero containment exposure.
[cycle]
producers = ["scout", "harvest"]
