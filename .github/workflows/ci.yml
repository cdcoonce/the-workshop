name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The version-bump gate diffs plugins/ against the base branch, so
          # the base ref must be resolvable. checkout defaults to depth 1.
          fetch-depth: 0

      - name: Install uv
        # No floating v9 major tag is published yet; pin the exact release.
        uses: astral-sh/setup-uv@v9.0.0

      - name: Sync dependencies
        run: uv sync

      - name: Resolve version-bump gate base and mode from the PR target branch
        # Only on pull_request events is github.base_ref populated. A PR into
        # `main` (the promotion) is the one fail-closed delivery gate:
        # release mode. A PR into any other branch (dev, afk/*) is
        # version-neutral: integration mode against its own base. On push
        # nothing is set, so the Makefile defaults apply (origin/main,
        # integration): dev is ahead of main at the same version between
        # releases and must not go red for it. See #568.
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "VERSION_BASE=origin/$BASE_REF" >> "$GITHUB_ENV"
          if [ "$BASE_REF" = "main" ]; then
            echo "VERSION_MODE=release" >> "$GITHUB_ENV"
          else
            echo "VERSION_MODE=integration" >> "$GITHUB_ENV"
          fi

      - name: Run gate (lint + test suites + version-bump gate)
        run: make test
