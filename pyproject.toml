[project]
name = "the-workshop"
version = "0.1.0"
description = "Portable AI dev-environment toolkit — skills, agents, hooks, and methodology that install natively on Claude Code, Codex, and Cortex Code"
requires-python = ">=3.12"

# The repo is served, not distributed: the nine directories under `plugins/`
# are read in place by Claude Code, Codex, and Cortex. Nothing here builds a
# wheel or a console script, so uv treats it as a plain workspace rather than
# a package. The `the-workshop` entry point died with `scripts/installer/`.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

# Lint scope is pinned explicitly rather than left to ruff's defaults, which
# vary by ruff version and (with no config present at all) pull in a broad
# stylistic set. These rules are the high-signal ones — real defects, not
# formatting: F (pyflakes: undefined names, unused imports, f-string bugs),
# E4 (imports), E7 (statement errors), E9 (syntax/IO errors).
#
# E501 (line-too-long) is deliberately excluded: it flags 104 existing lines
# and catches no defects. Widen this set only alongside fixing what it flags.
[tool.ruff]
target-version = "py312"
# plugins/workbench/machinery is the vault's engine payload, kept
# byte-comparable with its upstream repo — which owns its style, including the
# sys.path-bootstrap-then-import pattern this repo's E402 would flag. It is
# exercised by its own gate step (`make test-machinery`), not linted as the
# workshop's own Python.
extend-exclude = ["plugins/*/machinery"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
